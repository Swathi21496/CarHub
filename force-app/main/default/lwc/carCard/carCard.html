<template>
    <lightning-card title={carName} icon-name="standard:apex_plugin">
        <template if:true={carId}>
        <lightning-button-icon icon-name="utility:expand_alt" slot="actions" onclick={handleNavigateToRecord}></lightning-button-icon>
        <div class="slds-m-horizontal_medium">
            <img src={carPictureUrl} alt="Car Image" class="car-image" /> 
            <lightning-record-view-form onload={handleRecordLoad} record-id={carId} object-api-name="Car__c" density="compact">
                <lightning-output-field field-name={categoryField}></lightning-output-field>
                <lightning-output-field field-name={makeField}></lightning-output-field>
                <lightning-output-field field-name={msrpField}></lightning-output-field>
                <section>Other Features</section>
                <lightning-output-field field-name={fuelTypeField}></lightning-output-field>
                <lightning-output-field field-name={seatField}></lightning-output-field>
                <lightning-output-field field-name={controlField}></lightning-output-field>
            </lightning-record-view-form>
        </div>
        </template>
        <template if:false={carId}>
            <c-placeholder message="Select a car to view details"></c-placeholder>
        </template>
    </lightning-card>
</template>
